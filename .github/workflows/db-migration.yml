# Adds an EF Core migration on a branch, because migrations must be generated by the .NET tools.
# Run it from the Actions tab (or `gh workflow run db-migration.yml -f branch=... -f name=...`).
name: DB migration

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to add the migration to (never main)
        required: true
      name:
        description: Migration name, e.g. AddTenants
        required: true
      squash:
        description: Delete all existing migrations first and make one new initial migration (fresh databases only)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  migration:
    runs-on: ubuntu-latest
    if: ${{ inputs.branch != 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the name
        env:
          NAME: ${{ inputs.name }}
        run: |
          [[ "$NAME" =~ ^[A-Z][A-Za-z0-9]{2,60}$ ]] || { echo "Name must be PascalCase letters and digits"; exit 1; }
      - name: Add the migration
        working-directory: WhatsAppAutomation.Server/src
        env:
          NAME: ${{ inputs.name }}
          SQUASH: ${{ inputs.squash }}
          # Design time only: EF needs a connection string shape, it does not connect.
          ConnectionStrings__Default: Host=localhost;Database=design;Username=design;Password=design
          Auth__SigningKey: design-time-only-not-a-real-key-000000000000
        run: |
          dotnet tool install --global dotnet-ef --version "10.*"
          if [ "$SQUASH" = "true" ]; then rm -f WhatsAppAutomation.Infrastructure/Persistence/Migrations/*.cs; fi
          # Restore and build first: "migrations add" alone does not restore, and a build error shows clearly here.
          dotnet build WhatsAppAutomation.Api
          dotnet ef migrations add "$NAME" --no-build --project WhatsAppAutomation.Infrastructure --startup-project WhatsAppAutomation.Api -o Persistence/Migrations
      - name: Commit
        env:
          NAME: ${{ inputs.name }}
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A WhatsAppAutomation.Server/src/WhatsAppAutomation.Infrastructure/Persistence/Migrations
          git commit -m "Add migration $NAME"
          git push origin "HEAD:$BRANCH"
