# After CI passes on main: build the two Docker images, push them to GitHub's registry (ghcr.io),
# and update the server. The server keeps the previous version and goes back to it when the new one
# is not healthy (deploy/deploy.sh). Can also be started by hand (Actions > Deploy > Run workflow).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One deployment at a time; a newer one waits instead of cancelling a running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  OWNER: ${{ github.repository_owner }}

jobs:
  images:
    name: Build images
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: tag
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API + website image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: ghcr.io/${{ env.OWNER }}/whatsapp-automation-api:${{ steps.tag.outputs.tag }}
          secrets: |
            primeng_license=${{ secrets.PRIMENG_LICENSE_KEY }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.gateway
          push: true
          tags: ghcr.io/${{ env.OWNER }}/whatsapp-automation-gateway:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max

  server:
    name: Update the server
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key: the workflow only talks to our server.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy the server files
        run: |
          scp deploy/docker-compose.yml deploy/Caddyfile deploy/deploy.sh deploy/backup.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/whatsapp/"
      - name: Deploy
        env:
          TAG: ${{ needs.images.outputs.tag }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The registry login is only for this run (the token expires when the job ends).
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "echo '$REGISTRY_TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null \
             && bash /opt/whatsapp/deploy.sh '$TAG'; code=\$?; docker logout ghcr.io >/dev/null; exit \$code"
      - name: Public check
        run: curl -fsS --max-time 10 "https://${{ vars.SITE_HOST }}/health"
