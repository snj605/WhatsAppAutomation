# Android app for demo clients: push a tag like v1.0.0 and a signed APK appears on the GitHub
# Releases page, built against the production server. Can also be started by hand.
name: Mobile release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Signed Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WhatsAppAutomation.Mobile/whatsapp_automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      # The app's in-app updater compares its own version with the newest release tag, and Android only
      # installs an update whose build number is higher, so both come from here (tag v1.2.0 -> 1.2.0).
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="0.0.0"; fi
          if ! [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Tag must look like v1.2.0 (got $GITHUB_REF_NAME)"; exit 1; fi
          echo "BUILD_NAME=$NAME" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"
      - name: Build
        run: >
          flutter build apk --release
          --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER
          --dart-define=API_BASE_URL=https://${{ vars.SITE_HOST }}
          --obfuscate --split-debug-info=build/debug-info
      - name: Name the file
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "build/WhatsAppAutomation-${GITHUB_REF_NAME}.apk"
          # The app checks the download against this before installing it.
          (cd build && sha256sum "WhatsAppAutomation-${GITHUB_REF_NAME}.apk" > "WhatsAppAutomation-${GITHUB_REF_NAME}.apk.sha256")
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            WhatsAppAutomation.Mobile/whatsapp_automation/build/WhatsAppAutomation-${{ github.ref_name }}.apk
            WhatsAppAutomation.Mobile/whatsapp_automation/build/WhatsAppAutomation-${{ github.ref_name }}.apk.sha256
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: apk
          path: WhatsAppAutomation.Mobile/whatsapp_automation/build/*.apk
